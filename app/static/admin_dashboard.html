<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RentVance — Product Metrics</title>
<!--
  Internal analytics dashboard. Served by GET /admin/dashboard.

  This file ships NO data. It is a login box and an empty frame; every number arrives from
  GET /admin/analytics after the browser authenticates, so serving this page to a stranger
  discloses nothing.

  English-only LTR on purpose — the product is Hebrew-first and RTL, this admin page is not.

  Layout: seven tabs over one payload. Overview carries the handful of numbers worth checking
  daily; the other tabs hold the detail. The payload is fetched once per control change and
  kept in `state.data`, so switching tabs re-renders from memory and never refetches.

  Series colours come from a categorical palette validated for colour-vision deficiency in
  both light and dark. Slots 3 and 4 fall below 3:1 against a white surface, so the charts
  use slots 1 and 2 — which clear it — and reserve the other two for marks that carry visible
  value labels. Series colour is keyed to the entity (mobile / web), never to array position,
  so a series disappearing cannot repaint the ones that remain.
-->
<!-- Pin an exact version that actually exists on the CDN. 4.4.3 does NOT — cdnjs 404s it,
     which left `Chart` undefined and broke the page's startup. Verify any change to this
     line returns 200 before shipping it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root {
  color-scheme: light;
  /* Product palette — matches rent-control-web/src/index.css */
  --navy:            #1A2D4A;
  --primary:         #2563EB;
  --accent:          #0D9488;
  --bg:              #F1F5F9;
  --surface:         #FFFFFF;
  --text-primary:    #0F172A;
  --text-secondary:  #475569;
  --muted:           #64748B;
  --outline:         #CBD5E1;
  --grid:            #E7EDF3;
  --success:         #059669;
  --warning:         #D97706;
  --warning-bg:      #FEF3E2;
  --error:           #DC2626;
  --error-bg:        #FEF2F2;
  /* Validated categorical slots (light). Slots 1 and 2 clear 3:1 against this surface;
     3 and 4 do not, so they are used only where marks carry visible value labels. */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  /* "unknown"/other — deliberately neutral, and dark enough to clear 3:1 on white. */
  --series-muted: #64748B;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-card: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --navy:           #0E1726;
    --bg:             #12171F;
    --surface:        #1A1A19;
    --text-primary:   #F8FAFC;
    --text-secondary: #C3C2B7;
    --muted:          #8C8C85;
    --outline:        #33383F;
    --grid:           #2A2F36;
    --warning-bg:     #2A2113;
    --error-bg:       #2A1717;
    /* Same eight hues, stepped for the dark surface — not an automatic flip */
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-muted: #94A3B8;
  }
}
* { box-sizing: border-box; }
/* Any class that sets `display` beats the UA's [hidden] rule — .login-wrap's flex kept the
   login box on screen above the dashboard after sign-in. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
a { color: var(--primary); }

/* ── shell ─────────────────────────────────────────────────────────── */
header.topbar {
  background: var(--navy); color: #fff;
  padding: 12px 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
header.topbar h1 { font-size: 16px; }
header.topbar .meta { color: #9FB3CC; font-size: 12px; margin-left: auto; }
.health-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 12px; color: #fff; cursor: pointer;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px; padding: 3px 10px;
}
.health-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #94A3B8; }
.health-chip.ok .dot { background: #34D399; }
.health-chip.bad .dot { background: #FBBF24; }

/* Tabs and controls share one bar that stays put while the page scrolls under it. */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--outline);
}
.bar-inner {
  max-width: 1240px; margin: 0 auto; padding-inline: 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-right: auto; }
.tabs button {
  border: 0; background: none; font: inherit; font-size: 13.5px; font-weight: 550;
  color: var(--text-secondary); padding: 13px 12px 11px; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.tabs button:hover { color: var(--text-primary); }
.tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
main { max-width: 1240px; margin: 0 auto; padding-block: 20px; padding-inline: 16px; }

/* ── controls ──────────────────────────────────────────────────────── */
.segmented { display: inline-flex; border: 1px solid var(--outline); border-radius: var(--radius-sm); overflow: hidden; }
.segmented button {
  border: 0; background: var(--surface); color: var(--text-secondary);
  padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer;
}
.segmented button + button { border-left: 1px solid var(--outline); }
.segmented button[aria-pressed="true"] { background: var(--primary); color: #fff; }
select, input[type=email], input[type=password] {
  font: inherit; padding: 6px 10px; border: 1px solid var(--outline);
  border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary);
}
button.primary {
  background: var(--primary); color: #fff; border: 0; border-radius: var(--radius-sm);
  padding: 9px 16px; font: inherit; cursor: pointer;
}
button.ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--outline); border-radius: var(--radius-sm);
  padding: 6px 12px; font: inherit; cursor: pointer;
}

/* ── cards & tiles ─────────────────────────────────────────────────── */
section.block { margin-bottom: 26px; }
section.block > h2 { font-size: 15px; margin-bottom: 10px; }
.grid { display: grid; gap: 14px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); margin-bottom: 14px; }
.kpis.four, .charts.four { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.charts { grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--outline);
  border-radius: var(--radius-card); padding: 16px; min-width: 0;
}
.card > h3 {
  font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.tile > h3 { margin-bottom: 2px; }
.tile .value {
  /* Proportional figures on a display-size number; tabular only where digits stack. */
  font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15;
  margin-top: 2px;
}
.tile .value.small { font-size: 21px; }
.tile .caption { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpi { display: flex; flex-direction: column; }
.kpi .value { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 4px; }
.kpi .caption { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kpi .spark { position: relative; height: 40px; margin-top: 12px; }

/* The explanatory note behind each card title. Hover or focus shows it; it is the only place
   the note lives, so it must work from the keyboard too. */
.info {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--outline);
  font-size: 10px; font-weight: 700; font-style: normal; color: var(--muted); cursor: help;
}
.info:hover::after, .info:focus::after {
  content: attr(data-tip);
  position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
  width: max-content; max-width: 260px; z-index: 10;
  background: var(--navy); color: #fff; padding: 8px 10px; border-radius: 8px;
  font-size: 12px; font-weight: 400; line-height: 1.4; text-align: left;
}

/* Charts must reserve room for the x-axis band, or the card grows a nested scrollbar. */
.chart-wrap { position: relative; height: 240px; }

/* ── bars (funnel + breakdowns) ────────────────────────────────────── */
.funnel { display: flex; flex-direction: column; gap: 8px; }
.funnel-step { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: center; }
.funnel-label { font-size: 12.5px; color: var(--text-secondary); text-align: right; }
.funnel-track { background: var(--grid); border-radius: var(--radius-sm); overflow: hidden; height: 34px; position: relative; }
.funnel-bar {
  height: 100%; background: var(--series-1);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; padding-inline: 10px;
  color: #fff; font-weight: 600; font-size: 13px;
  min-width: 2px;
  transition: width .25s ease;
}
.funnel-bar.zero { background: var(--grid); }
/* Value sits outside when the bar is too narrow to hold it without clipping. */
.funnel-outside { position: absolute; inset-block: 0; display: flex; align-items: center; padding-left: 8px; font-weight: 600; font-size: 13px; color: var(--text-primary); }
.funnel-drop { font-size: 11.5px; color: var(--muted); margin-left: 182px; }
.funnel-drop.bad { color: var(--warning); }

.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: 140px 1fr 90px; gap: 10px; align-items: center; font-size: 12.5px; }
.hbar-label { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { background: var(--grid); border-radius: 6px; height: 18px; overflow: hidden; }
.hbar-fill { height: 100%; background: var(--series-1); border-radius: 6px; min-width: 2px; }
.hbar-value { text-align: right; font-variant-numeric: tabular-nums; }
.hbar-value span { color: var(--muted); margin-left: 6px; }
/* Narrow cards: label and value share a line, the bar runs full width underneath. */
.charts.four .hbar { grid-template-columns: 1fr auto; row-gap: 4px; }
.charts.four .hbar-track { grid-column: 1 / -1; order: 3; height: 10px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h3 { font-size: 13px; color: var(--text-secondary); font-weight: 600; display: flex; align-items: center; gap: 6px; }

/* ── misc ──────────────────────────────────────────────────────────── */
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
table.data th { color: var(--muted); font-weight: 600; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }

.empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; min-height: 120px;
  color: var(--muted); font-size: 13px; text-align: center; padding: 16px;
}
.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
.banner.error { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }
.banner.warn  { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
.banner strong { display: block; margin-bottom: 3px; }
.caveats { font-size: 12px; color: var(--muted); margin: 0; padding-left: 18px; }
.caveats li { margin-bottom: 6px; }
details.notes { margin-top: 8px; }
details.notes summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--grid); color: var(--text-secondary); }
.pill.ok { background: #DCFCE7; color: #166534; }
.pill.bad { background: var(--error-bg); color: var(--error); }

/* ── login ─────────────────────────────────────────────────────────── */
.login-wrap { min-height: 72vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius-card); padding: 26px; width: 100%; max-width: 380px; }
.login h2 { font-size: 17px; margin-bottom: 4px; }
.login p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
.login label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.login input { width: 100%; margin-bottom: 12px; }
.login button { width: 100%; }
.login .msg { margin-top: 12px; font-size: 12.5px; }
.login .msg.error { color: var(--error); }
.login button.google {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--surface); color: var(--text-primary);
  border: 1px solid var(--outline); border-radius: var(--radius-sm);
  padding: 10px 16px; font: inherit; font-weight: 550; cursor: pointer;
}
.login button.google:hover { background: var(--bg); }
.login .divider {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0 14px; color: var(--muted); font-size: 12px;
}
.login .divider::before, .login .divider::after {
  content: ""; flex: 1; height: 1px; background: var(--outline);
}
@media (max-width: 560px) {
  /* The bar wraps to three rows here; pinned, it would eat a quarter of the screen. */
  .bar { position: static; }
  .funnel-step { grid-template-columns: 1fr; }
  .funnel-label { text-align: left; }
  .funnel-drop { margin-left: 0; }
  .hbar { grid-template-columns: 90px 1fr 70px; }
  .kpi .value { font-size: 34px; }
}
</style>
</head>
<body>

<div id="login-view" class="login-wrap">
  <form class="login" id="login-form">
    <h2>RentVance metrics</h2>
    <p>Internal dashboard. Sign in with your RentVance account.</p>

    <button class="google" type="button" id="google-btn">
      <!-- Inline so the button needs no external image request. -->
      <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="primary" type="submit" id="login-btn">Sign in</button>
    <div class="msg" id="login-msg" hidden></div>
  </form>
</div>

<div id="app-view" hidden>
  <header class="topbar">
    <h1>RentVance — Product Metrics</h1>
    <button class="health-chip" id="health-chip" type="button" hidden>
      <span class="dot"></span><span id="health-text"></span>
    </button>
    <span class="meta" id="meta"></span>
    <button class="ghost" id="signout" style="color:#9FB3CC;border-color:#2E4468">Sign out</button>
  </header>

  <div class="bar">
    <div class="bar-inner">
      <nav class="tabs" role="tablist" id="tabs" aria-label="Dashboard sections">
        <button role="tab" data-tab="overview">Overview</button>
        <button role="tab" data-tab="subscriptions">Subscriptions</button>
        <button role="tab" data-tab="growth">Growth</button>
        <button role="tab" data-tab="countries">Countries</button>
        <button role="tab" data-tab="ai">AI</button>
        <button role="tab" data-tab="platform">Platform</button>
        <button role="tab" data-tab="health">Health</button>
      </nav>
      <div class="controls">
        <span class="segmented" id="range-seg" aria-label="Date range">
          <button data-v="7d">7d</button><button data-v="30d">30d</button>
          <button data-v="90d" aria-pressed="true">90d</button><button data-v="all">All</button>
        </span>
        <select id="country" aria-label="Country"><option value="">All countries</option></select>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
    </div>
  </div>

  <main role="tabpanel" id="panel">
    <div id="banners"></div>
    <div id="sections"></div>
  </main>
</div>

<script>
/* ── Firebase config, injected server-side ─────────────────────────── */
const FIREBASE_CONFIG = __FIREBASE_CONFIG__;

const $ = (s) => document.querySelector(s);
const TABS = ['overview', 'subscriptions', 'growth', 'countries', 'ai', 'platform', 'health'];
const state = {
  range: '90d', country: '', charts: {}, seq: 0, data: null,
  tab: 'overview', breakdown: 'language', countryMetric: 'owners',
};

/** Granularity follows the range rather than being a second control: a 7- or 30-day window
 *  reads best by day, anything longer by week. */
const granularityFor = (range) => (range === '7d' || range === '30d') ? 'day' : 'week';

/* ── formatting ────────────────────────────────────────────────────── */
const nf = new Intl.NumberFormat('en-US');
const num = (v) => (v === null || v === undefined) ? '—' : nf.format(v);
const pct = (v) => (v === null || v === undefined) ? '—' : v.toFixed(1) + '%';
// Timestamps arrive naive and are UTC (app.clock.utc_now_naive). Without the 'Z' the
// browser reads them as local time, which shifts a bucket label by a day for anyone west
// of UTC — the labels would disagree with the data by one row.
function parseUtc(iso) {
  const s = String(iso);
  return new Date(/[Zz]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
}
function bucketLabel(iso, granularity) {
  if (!iso) return '';
  const s = String(iso);
  const d = parseUtc(s);
  if (isNaN(d)) return s.slice(0, 10);
  const opts = granularity === 'month'
    ? { year: 'numeric', month: 'short', timeZone: 'UTC' }
    : { month: 'short', day: 'numeric', timeZone: 'UTC' };
  return d.toLocaleDateString('en-US', opts);
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── empty buckets ─────────────────────────────────────────────────── */
// SQL GROUP BY returns only buckets that had rows, so a quiet week is simply missing and a
// line chart draws straight across it — a week with zero signups reads as a busy one.
// These rebuild the full run of buckets and fill the holes with zeros.
const DAY_MS = 86400000;
/** Postgres date_trunc('day'|'week') in UTC: midnight, and Monday for weeks. */
function truncUtc(date, granularity) {
  const d = Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
  return granularity === 'week' ? d - ((new Date(d).getUTCDay() + 6) % 7) * DAY_MS : d;
}
/** Every bucket start (ms) in the window. On 'All' the window opens at a fixed 2025 epoch,
 *  before the product existed, so it starts at the first bucket with data instead. */
function bucketKeys(d, rows) {
  const g = d.window.granularity;
  const step = g === 'week' ? 7 * DAY_MS : DAY_MS;
  const have = rows.map((r) => parseUtc(r.bucket).getTime()).filter((t) => !isNaN(t));
  let start = truncUtc(parseUtc(d.window.since), g);
  if (d.window.range === 'all') {
    if (!have.length) return [];
    start = Math.min(...have);
  }
  const end = truncUtc(parseUtc(d.generated_at), g);
  const keys = [];
  for (let t = start; t <= end; t += step) keys.push(t);
  return keys;
}
/** One row per bucket, with `fields` zeroed where the query returned nothing. No rows at all
 *  stays empty, so chartOrEmpty still says "no data yet" instead of drawing a flat zero. */
function fillBuckets(d, rows, fields) {
  rows = rows || [];
  if (!rows.length) return rows;
  const byKey = new Map(rows.map((r) => [parseUtc(r.bucket).getTime(), r]));
  return bucketKeys(d, rows).map((t) => byKey.get(t) ||
    Object.assign({ bucket: new Date(t).toISOString() },
                  Object.fromEntries(fields.map((f) => [f, 0]))));
}

/* ── auth ──────────────────────────────────────────────────────────── */
let FIREBASE_READY = false;

function initAuth() {
  const fail = (text) => {
    $('#login-msg').hidden = false;
    $('#login-msg').className = 'msg error';
    $('#login-msg').textContent = text;
    // Disable BOTH buttons. Leaving Google enabled here is what turned a missing config
    // into a confusing "No Firebase App has been created" on click.
    $('#login-btn').disabled = true;
    $('#google-btn').disabled = true;
  };

  if (typeof firebase === 'undefined') {
    return fail('The Firebase SDK did not load. Check your connection and reload.');
  }
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
    return fail('Firebase web config is not set on the server. Set FIREBASE_WEB_API_KEY ' +
                'and FIREBASE_WEB_APP_ID, then reload.');
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  FIREBASE_READY = true;
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) return;
    $('#login-view').hidden = true;
    $('#app-view').hidden = false;
    load();
  });
}

function showLoginError(err) {
  const msg = $('#login-msg');
  msg.hidden = false;
  msg.className = 'msg error';
  const code = err && err.code;
  if (code === 'auth/unauthorized-domain') {
    // The most likely failure on a fresh deployment: Firebase only runs the OAuth flow on
    // domains it has been told about, and this page is on the backend's domain, which is
    // not the one the web app uses.
    msg.textContent =
      'Firebase has not authorised this domain for sign-in. Add ' + location.hostname +
      ' in the Firebase console under Authentication → Settings → Authorized domains, ' +
      'then reload.';
  } else if (code === 'auth/popup-blocked') {
    msg.textContent = 'Your browser blocked the sign-in popup. Allow popups for this site and try again.';
  } else if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
    msg.textContent = 'Sign-in was cancelled.';
  } else {
    msg.textContent = (err && err.message) ? err.message : 'Sign-in failed.';
  }
}

$('#google-btn').addEventListener('click', async () => {
  if (!FIREBASE_READY) return;
  const msg = $('#login-msg');
  msg.hidden = false; msg.className = 'msg'; msg.textContent = 'Opening Google…';
  $('#google-btn').disabled = true;
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    // Always ask which account, rather than silently reusing whichever Google session the
    // browser happens to hold — the admin account may not be the default one.
    provider.setCustomParameters({ prompt: 'select_account' });
    await firebase.auth().signInWithPopup(provider);
  } catch (err) {
    showLoginError(err);
  } finally {
    $('#google-btn').disabled = false;
  }
});

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!FIREBASE_READY) return;
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const msg = $('#login-msg');
  if (!email || !password) {
    msg.hidden = false; msg.className = 'msg error';
    msg.textContent = 'Enter an email and password, or use Continue with Google.';
    return;
  }
  msg.hidden = false; msg.className = 'msg'; msg.textContent = 'Signing in…';
  $('#login-btn').disabled = true;
  try {
    await firebase.auth().signInWithEmailAndPassword(email, password);
  } catch (err) {
    showLoginError(err);
    $('#login-btn').disabled = false;
  }
});

$('#signout').addEventListener('click', async () => {
  await firebase.auth().signOut();
  location.reload();
});

/* ── fetch ─────────────────────────────────────────────────────────── */
async function load() {
  // Every control click starts a request, and a slow older one can land after a newer one.
  // Only the latest may touch the page, or the controls say 7d over 90d charts.
  const seq = ++state.seq;
  const stale = () => seq !== state.seq;

  $('#banners').innerHTML = '';
  $('#meta').textContent = 'Loading…';
  $('#sections').style.opacity = '0.5';

  const qs = new URLSearchParams({ range: state.range, granularity: granularityFor(state.range) });
  if (state.country) qs.set('country', state.country);

  let res;
  try {
    // Asked for on every load, not once at sign-in: ID tokens expire after an hour, and the
    // endpoint answers an expired one with the same 404 as a non-admin. getIdToken() returns
    // the cached token until it is about to expire, then refreshes it.
    const user = firebase.auth().currentUser;
    if (!user) return location.reload();
    const token = await user.getIdToken();
    // Bearer header only — never a token in the query string, which would land in access
    // logs, proxy logs, browser history and Referer.
    res = await fetch('./analytics?' + qs.toString(), {
      headers: { Authorization: 'Bearer ' + token },
    });
  } catch (err) {
    if (stale()) return;
    return fail('Network error', String(err));
  }
  if (stale()) return;
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).detail || ''; } catch (_) { detail = await res.text().catch(() => ''); }
    if (stale()) return;
    if (res.status === 404) {
      return fail('HTTP 404 — not found',
        'Either this route does not exist, or your account is not in ADMIN_OWNER_IDS. ' +
        'The endpoint answers 404 for both so it cannot be used to probe for admin accounts.');
    }
    return fail('HTTP ' + res.status + ' ' + res.statusText, detail);
  }

  const data = await res.json();
  if (stale()) return;
  state.data = data;
  $('#meta').textContent =
    'Updated ' + new Date(data.generated_at + 'Z').toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
    (data.cached ? ' · cached' : '');
  $('#banners').innerHTML = (data.warnings || []).map((w) =>
    '<div class="banner warn"><strong>Data warning</strong>' + esc(w) + '</div>').join('');
  populateCountries(data.platform.owner_country);
  renderHealthChip(data);
  renderTab();
}

function fail(title, detail) {
  state.data = null;
  destroyAll();
  $('#meta').textContent = '';
  $('#sections').style.opacity = '';
  $('#health-chip').hidden = true;
  $('#banners').innerHTML =
    '<div class="banner error"><strong>' + esc(title) + '</strong>' + esc(detail) + '</div>';
  $('#sections').innerHTML = '';
}

/* ── chart helpers ─────────────────────────────────────────────────── */
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function baseOptions(extra) {
  const grid = css('--grid'), text = css('--text-secondary');
  return Object.assign({
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        display: true, position: 'bottom',
        labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle',
                  color: text, font: { size: 11 }, padding: 14 },
      },
      tooltip: {
        backgroundColor: css('--navy'), padding: 10, cornerRadius: 8,
        titleFont: { size: 12 }, bodyFont: { size: 12 }, displayColors: true, boxWidth: 8,
      },
    },
    scales: {
      x: { grid: { display: false }, border: { color: grid },
           ticks: { color: text, font: { size: 11 }, maxRotation: 0, autoSkipPadding: 12 } },
      y: { beginAtZero: true, grid: { color: grid, drawTicks: false },
           border: { display: false },
           ticks: { color: text, font: { size: 11 }, precision: 0, padding: 8 } },
    },
  }, extra || {});
}
/** baseOptions with the legend off — for single-series charts, where it only repeats the title. */
const singleSeries = (extra) => baseOptions(Object.assign({
  plugins: { legend: { display: false }, tooltip: baseOptions().plugins.tooltip },
}, extra || {}));

function destroy(id) { if (state.charts[id]) { state.charts[id].destroy(); delete state.charts[id]; } }
function destroyAll() { Object.keys(state.charts).forEach(destroy); }

/** Renders a chart, or an honest empty state — never a chart drawn from [] that reads as zero. */
function chartOrEmpty(canvasId, rows, build, emptyText) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  const wrap = el.parentElement;
  destroy(canvasId);
  if (!CHARTS_AVAILABLE) {
    wrap.innerHTML = '<div class="empty">Chart library unavailable — the numbers and ' +
      'tables are unaffected.</div>';
    return;
  }
  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div class="empty">' + esc(emptyText || 'No data yet') + '</div>';
    return;
  }
  state.charts[canvasId] = new Chart(el.getContext('2d'), build());
}

/** A bare trend line under a KPI: no axes, no tooltip, nothing to read but the shape. */
function sparkline(canvasId, values) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (!CHARTS_AVAILABLE || values.length < 2) { el.parentElement.remove(); return; }
  state.charts[canvasId] = new Chart(el.getContext('2d'), {
    type: 'line',
    data: { labels: values.map((_, i) => i), datasets: [{
      data: values, borderColor: css('--series-1'), borderWidth: 2,
      cubicInterpolationMode: 'monotone', pointRadius: 0, fill: false,
    }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, events: [],
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false, beginAtZero: true } },
    },
  });
}

function lineSeries(label, data, colorVar) {
  return {
    label, data,
    borderColor: css(colorVar), backgroundColor: css(colorVar),
    // Monotone, not a free tension: a smoothed curve overshoots below zero next to an empty
    // bucket, drawing negative signups.
    borderWidth: 2, cubicInterpolationMode: 'monotone',
    pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 24,
  };
}
function barSeries(label, data, colorVar) {
  return {
    label, data,
    backgroundColor: css(colorVar),
    borderRadius: 4, borderSkipped: false,
    // A 2px surface gap between adjacent fills rather than a stroke around each bar.
    borderColor: css('--surface'), borderWidth: { top: 0, right: 1, bottom: 0, left: 1 },
    maxBarThickness: 34,
  };
}

/* Direct value labels — the relief for the two palette slots that sit below 3:1 on white,
   and the reason no value here is reachable only by hovering. */
const valueLabels = {
  id: 'valueLabels',
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || !opts.enabled) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = css('--text-secondary');
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden) return;
      meta.data.forEach((el, j) => {
        const v = ds.data[j];
        if (v === null || v === undefined || v === 0) return;
        ctx.fillText(nf.format(v), el.x, el.y - 4);
      });
    });
    ctx.restore();
  },
};
// Guarded. This used to be a bare `Chart.register(...)` at the top level, and when the CDN
// 404'd it threw here — which stopped the rest of the script, including the Firebase
// initialisation at the bottom. The visible symptom was "No Firebase App has been created"
// on sign-in: an error about auth whose actual cause was a missing chart library.
// Charting is a feature of this page; signing in is the page working at all. Never let the
// first break the second.
const CHARTS_AVAILABLE = typeof Chart !== 'undefined';
if (CHARTS_AVAILABLE) {
  Chart.register(valueLabels);
} else {
  console.error('Chart.js failed to load — tables and numbers will still render.');
}

/* ── building blocks ───────────────────────────────────────────────── */
const info = (note) => note
  ? '<span class="info" tabindex="0" role="note" aria-label="' + esc(note) + '" data-tip="' + esc(note) + '">i</span>'
  : '';
function tile(label, value, caption, small, note) {
  return '<div class="card tile"><h3>' + esc(label) + info(note) + '</h3>' +
    '<div class="value' + (small ? ' small' : '') + '">' + esc(value) + '</div>' +
    (caption ? '<div class="caption">' + esc(caption) + '</div>' : '') + '</div>';
}
function kpi(label, value, caption, sparkId, note) {
  return '<div class="card kpi"><h3>' + esc(label) + info(note) + '</h3>' +
    '<div class="value">' + esc(value) + '</div>' +
    '<div class="caption">' + esc(caption) + '</div>' +
    (sparkId ? '<div class="spark"><canvas id="' + sparkId + '"></canvas></div>' : '') + '</div>';
}
function card(title, note, body) {
  return '<div class="card"><h3>' + esc(title) + info(note) + '</h3>' + body + '</div>';
}
const canvasCard = (title, note, id) =>
  card(title, note, '<div class="chart-wrap"><canvas id="' + id + '"></canvas></div>');
const section = (title, body) =>
  '<section class="block">' + (title ? '<h2>' + esc(title) + '</h2>' : '') + body + '</section>';

/** The payload's caveats for the scopes this tab shows, collapsed at the bottom of it. */
function notesFor(d, scopes) {
  const items = (d.caveats || []).filter((c) => scopes.includes(c.scope));
  if (!items.length) return '';
  return '<details class="notes card"><summary>Before you trust these numbers (' + items.length +
    ')</summary><ul class="caveats">' +
    items.map((c) => '<li>' + esc(c.text) + '</li>').join('') + '</ul></details>';
}

/** Horizontal bars with the value and its share. `items` is [{label, value}], drawn in the
 *  order given, each bar scaled to the largest. */
function hbars(items, emptyText) {
  const total = items.reduce((s, x) => s + (x.value || 0), 0);
  if (!items.length || !total) return '<div class="empty">' + esc(emptyText || 'Nothing recorded yet') + '</div>';
  const max = Math.max(...items.map((x) => x.value || 0)) || 1;
  return '<div class="hbars">' + items.map((x) => {
    const v = x.value || 0;
    return '<div class="hbar"><div class="hbar-label" title="' + esc(x.label) + '">' + esc(x.label) +
      '</div><div class="hbar-track"><div class="hbar-fill" style="width:' + (100 * v / max).toFixed(1) +
      '%' + (x.color ? ';background:var(' + x.color + ')' : '') + '"></div></div><div class="hbar-value">' +
      num(v) + '<span>' + Math.round(100 * v / total) + '%</span></div></div>';
  }).join('') + '</div>';
}
/** A segmented switch. `options` is {value: label}. */
const switcher = (id, options, current, label) =>
  '<span class="segmented" id="' + id + '" aria-label="' + esc(label) + '">' +
  Object.entries(options).map(([k, v]) =>
    '<button data-v="' + k + '" aria-pressed="' + (k === current) + '">' + esc(v) + '</button>').join('') +
  '</span>';
/** Sum a field over rows, grouped by a key — for reshaping the subscription snapshot. */
function sumBy(rows, key, field) {
  const out = {};
  rows.forEach((r) => { out[r[key]] = (out[r[key]] || 0) + (r[field] || 0); });
  return out;
}

/* ── tabs ──────────────────────────────────────────────────────────── */
const TAB_RENDER = {
  overview:      [overviewHTML, drawOverview],
  subscriptions: [subscriptionsHTML, drawSubscriptions],
  growth:        [growthHTML, drawGrowth],
  countries:     [countriesHTML, drawCountries],

function renderTab() {
  document.querySelectorAll('#tabs [role=tab]').forEach((b) => {
    const on = b.dataset.tab === state.tab;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  });
  // The Countries tab compares countries with each other, so the filter does nothing there.

/** The tab lives in the URL hash so a refresh — or a pasted link — lands on the same one. */
function tabFromHash() {
  const h = location.hash.replace('#', '');
  state.tab = TABS.includes(h) ? h : 'overview';
}
window.addEventListener('hashchange', () => { tabFromHash(); renderTab(); });
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[role=tab]'); if (!b) return;
  location.hash = b.dataset.tab;
});
$('#tabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TABS.indexOf(state.tab) + (e.key === 'ArrowRight' ? 1 : -1);
  const next = TABS[(i + TABS.length) % TABS.length];
  location.hash = next;
  document.querySelector('#tabs [data-tab="' + next + '"]').focus();
});

/* ── health chip ───────────────────────────────────────────────────── */
const STALE_MS = 36 * 3600 * 1000;
function isStale(job, now) {
  const lastOk = job.last_ok ? parseUtc(job.last_ok) : null;
  return !lastOk || (now - lastOk.getTime()) > STALE_MS;
}
function renderHealthChip(d) {
  const jobs = d.operations.jobs || [];
  const now = Date.now();
  const stale = jobs.filter((j) => isStale(j, now)).length;
  const chip = $('#health-chip');
  chip.hidden = false;
  chip.className = 'health-chip ' + (!jobs.length ? '' : stale ? 'bad' : 'ok');
  $('#health-text').textContent = !jobs.length ? 'No job runs in range'
    : stale ? stale + ' job' + (stale > 1 ? 's' : '') + ' stale' : 'All jobs healthy';
}
$('#health-chip').addEventListener('click', () => { location.hash = 'health'; });

function populateCountries(rows) {
  const sel = $('#country');
  if (sel.dataset.filled) return;
  (rows || []).forEach((r) => {
    const o = document.createElement('option');
    o.value = r.country; o.textContent = r.country + ' (' + r.owners + ')';
    sel.appendChild(o);
  });
  sel.dataset.filled = '1';
}

/* ── overview ──────────────────────────────────────────────────────── */
function funnelBody(d) {
  const f = d.funnel || {};
  const steps = [
    ['Signed up', f.step_signed_up],
    ['Added a property', f.step_property],
    ['Added a renter', f.step_renter],
    ['Recorded a transaction', f.step_transaction],
    ['Exported a report', f.step_export],
  ];
  const top = steps[0][1] || 0;
  if (!top) return '<div class="empty">No owners signed up in this range yet, so there is no funnel to draw.</div>';
  return '<div class="funnel">' + steps.map(([label, v], i) => {
    const value = v || 0;
    const w = (value / top) * 100;
    // Below ~14% the value would be clipped by its own bar, so it sits outside instead.
    const inside = w >= 14;
    const bar = '<div class="funnel-bar' + (value === 0 ? ' zero' : '') + '" style="width:' + w.toFixed(1) + '%">' +
      (inside ? num(value) : '') + '</div>' +
      (inside ? '' : '<div class="funnel-outside" style="left:' + w.toFixed(1) + '%">' + num(value) + '</div>');
    const prev = i > 0 ? (steps[i - 1][1] || 0) : null;
    const drop = (prev && prev > 0) ? (100 * (prev - value) / prev) : null;
    const dropLine = drop === null ? '' :
      '<div class="funnel-drop' + (drop >= 50 ? ' bad' : '') + '">↓ ' + drop.toFixed(0) +
      '% drop-off (' + num(prev - value) + ' owners)</div>';
    return '<div class="funnel-step"><div class="funnel-label">' + esc(label) +
      '</div><div class="funnel-track">' + bar + '</div></div>' + dropLine;
  }).join('') + '</div>';
}

function overviewHTML(d) {
  const g = d.window.granularity;
  const t = d.growth.totals || {};
  const subs = subscriptionSummary(d);
  const active = fillBuckets(d, d.engagement.active_owners, ['active_owners']);
  // The last bucket is the current, unfinished one — a Monday-morning number would read as
  // a collapse every week. The one before it is the latest complete period.
  const lastFull = active.length >= 2 ? active[active.length - 2].active_owners : null;
  const scans = (d.ai.scans || []).reduce((s, r) => s + (r.scans || 0), 0);
  const saved = (d.ai.scans || []).reduce((s, r) => s + (r.saved || 0), 0);
  const messages = (d.ai.assistant || []).reduce((s, r) => s + (r.messages || 0), 0);

  return section('', '<div class="grid kpis">' +
      kpi('Paying subscribers', num(subs.paying),
          subs.trial ? '+' + num(subs.trial) + ' on trial' : 'right now', null,
          'Subscriptions that confer a paid plan right now, trials excluded. Grandfathered accounts are not counted.') +
      kpi('Live owners', num(t.live_owners), '+' + num(t.new_in_window) + ' in this range', null,
          'Accounts that exist right now. Deleting an account removes its row.') +
      kpi('New signups', num(t.new_in_window), 'in this range', 'k-signups') +
      kpi('Active owners', num(lastFull), g === 'week' ? 'last full week' : 'yesterday', 'k-active',
          'Distinct owners who wrote something — a property, renter, transaction, export, scan or assistant message.') +
      kpi('Lease scans', num(scans), scans ? pct(100 * saved / scans) + ' saved' : 'in this range', 'k-scans') +
      kpi('Assistant messages', num(messages), 'in this range', 'k-agent') +
    '</div>') +
    section('Activation funnel', card('Signup → first report export',
      'Each step requires every step before it, so the funnel can only go down. Cohort starts ' +
      d.window.cohort_floor + '.', funnelBody(d))) +
    notesFor(d, ['funnel']);
}
function drawOverview(d) {

  sparkline('k-active', fillBuckets(d, d.engagement.active_owners, ['active_owners']).map((r) => r.active_owners));
  sparkline('k-scans', fillBuckets(d, d.ai.scans, ['scans']).map((r) => r.scans));

/* ── subscriptions ─────────────────────────────────────────────────── */
// Built before billing goes live, so every panel must read sensibly at zero and fill in by
// itself once the first webhook lands — no code change on launch day.
const PAYING_STATES = ['active', 'canceling', 'payment_failed'];
const PLAN_LABELS = { tier_3_8: '3–8 properties', tier_9_15: '9–15 properties', tier_16_plus: '16+ properties' };
const SOURCE_LABELS = { apple: 'App Store', google: 'Google Play', paddle: 'Web (Paddle)' };
const STATE_LABELS = {
  active: 'Active', trial: 'Trial', canceling: 'Canceled, paid to period end',
  payment_failed: 'Payment failed, in grace', ended: 'Ended',
};
function money(amount, currency) {
  try {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency, maximumFractionDigits: 0 }).format(amount);
  } catch (_) {
    return nf.format(Math.round(amount)) + ' ' + currency;
  }
}
function subscriptionSummary(d) {
  const rows = (d.subscriptions && d.subscriptions.state) || [];
  const live = rows.filter((r) => PAYING_STATES.includes(r.state));
  const byState = sumBy(rows, 'state', 'subscriptions');
  // Per currency, never across them: there is no honest single total of shekels and dollars.
  const mrr = {};
  live.forEach((r) => {
    if (r.currency && r.monthly_amount != null) mrr[r.currency] = (mrr[r.currency] || 0) + r.monthly_amount;
  });
  return {
    rows, live, byState, mrr,
    paying: live.reduce((s, r) => s + (r.subscriptions || 0), 0),
    trial: byState.trial || 0,
  };
}
const labelled = (counts, labels) => Object.entries(counts)
  .map(([k, v]) => ({ label: labels[k] || k, value: v }))
  .sort((a, b) => b.value - a.value);

function subscriptionsHTML(d) {
  const sub = d.subscriptions || {};
  const s = subscriptionSummary(d);
  const acc = sub.accounts || {}, wh = sub.webhook || {};
  const mrr = Object.entries(s.mrr).sort((a, b) => b[1] - a[1]);
  const banner = (!s.rows.length && !wh.events)
    ? '<div class="banner warn"><strong>Billing is not live yet</strong>No subscription has been ' +
      'recorded. Every panel here fills in by itself once the first RevenueCat webhook lands.</div>'
    : '';

  const currencyTable = mrr.length
    ? '<table class="data"><thead><tr><th>Currency</th><th class="num">Subscribers</th>' +
      '<th class="num">Per month</th></tr></thead><tbody>' + mrr.map(([c, v]) =>
        '<tr><td>' + esc(c) + '</td><td class="num">' +
        num(s.live.filter((r) => r.currency === c).reduce((n, r) => n + r.subscriptions, 0)) +
        '</td><td class="num">' + esc(money(v, c)) + '</td></tr>').join('') + '</tbody></table>'
    : '<div class="empty">No paying subscribers yet</div>';

  const whRow = (label, value, bad) => '<tr><td>' + esc(label) + '</td><td class="num">' +
    (bad ? '<span class="pill bad">' + num(value) + '</span>' : num(value)) + '</td></tr>';
  const webhook = '<table class="data"><tbody>' +
    whRow('Events in this range', wh.events) +
    whRow('Applied', wh.applied) +
    whRow('Unrecognised product', wh.unmapped, (wh.unmapped || 0) > 0) +
    whRow('Arrived out of order', wh.stale) +
    whRow('Sandbox (store testing)', wh.sandbox) +
    '<tr><td>Last received</td><td class="num">' +
      (wh.last_received ? parseUtc(wh.last_received).toLocaleString() : 'never') + '</td></tr>' +
    '</tbody></table>';

  return banner +
    section('', '<div class="grid kpis four">' +
      kpi('Paying subscribers', num(s.paying), s.trial ? '+' + num(s.trial) + ' on trial' : 'right now', null,
          'Includes canceled subscriptions still inside the period they paid for, and failed payments still in grace.') +
      kpi('Monthly revenue', mrr.length ? money(mrr[0][1], mrr[0][0]) : '—',
          mrr.length > 1 ? '+ ' + mrr.slice(1).map(([c, v]) => money(v, c)).join(' · ') : 'store prices, per month', null,
          'Yearly plans divided by 12. One figure per currency — they are never added together.') +
      kpi('Free accounts at the limit', num(acc.free_at_limit), 'of ' + num(acc.free) + ' free accounts', null,
          'Free accounts with 2 properties, the free plan\'s ceiling. Their next property needs a paid plan.') +
      kpi('Grandfathered', num(acc.grandfathered), 'top plan for free, for good', null,
          'Accounts from before billing keep the top plan permanently (owners.granted_plan). Not counted as paying.') +
    '</div>') +
    section('Accounts', '<div class="grid charts">' +
      card('Every account by plan', 'Each live account counted once.', hbars([
        { label: 'Paid plan (incl. trial)', value: acc.on_paid_plan },
        { label: 'Grandfathered', value: acc.grandfathered },
        { label: 'Free', value: acc.free },
      ], 'No accounts yet')) +
      canvasCard('Owners by number of properties',
        'Grouped by the plans\' property bands, so each bar is where those owners would land on pricing.', 'c-dist') +
    '</div>') +
    section('Subscribers', '<div class="grid charts four">' +
      card('By plan', 'Paying subscribers only.', hbars(labelled(sumBy(s.live, 'plan', 'subscriptions'), PLAN_LABELS), 'No paying subscribers yet')) +
      card('By store', 'Where they bought. App Store and Google Play subscriptions can only be canceled in the store.',
           hbars(labelled(sumBy(s.live, 'source', 'subscriptions'), SOURCE_LABELS), 'No paying subscribers yet')) +
      card('By status', 'Every subscription ever recorded, including ended ones.',
           hbars(labelled(s.byState, STATE_LABELS), 'No subscriptions yet')) +
      card('Revenue by currency', 'Store-reported prices, for orientation — not accounting.', currencyTable) +
    '</div>') +
    section('Over time', '<div class="grid charts">' +
      canvasCard('New vs canceled', 'From the webhook log, sandbox purchases excluded.', 'c-sub-events') +
      card('RevenueCat webhook', 'Is billing data arriving, and is it understood? An unrecognised product leaves a payer on the free plan.', webhook) +
    '</div>') +
    notesFor(d, ['subscriptions']);
}
function drawSubscriptions(d, g) {
  const dist = d.engagement.distribution;
  const bandLabel = { '0': '0', '1-2': '1–2 (free)', '3-8': '3–8', '9-15': '9–15', '16+': '16+' };
  const axis = (text) => ({ display: true, text, color: css('--muted'), font: { size: 11 } });
  chartOrEmpty('c-dist', dist && dist.properties.some(Boolean) ? dist.buckets : [], () => ({
    type: 'bar',
    data: { labels: dist.buckets.map((b) => bandLabel[b] || b),
            datasets: [barSeries('Owners', dist.properties, '--series-1')] },
    options: singleSeries({
      plugins: { legend: { display: false }, tooltip: baseOptions().plugins.tooltip, valueLabels: { enabled: true } },
      scales: {
        x: Object.assign({}, baseOptions().scales.x, { title: axis('Properties per owner') }),
        y: Object.assign({}, baseOptions().scales.y, { title: axis('Owners') }),
      },
    }),
  }), 'No owners yet');

  const e = fillBuckets(d, (d.subscriptions || {}).events, ['started', 'canceled']);
  chartOrEmpty('c-sub-events', e, () => ({
    type: 'bar',
    data: { labels: e.map((r) => bucketLabel(r.bucket, g)), datasets: [
      barSeries('New', e.map((r) => r.started), '--series-1'),
      barSeries('Canceled', e.map((r) => r.canceled), '--series-2'),
    ] },
    options: baseOptions(),
  }), 'No subscription events yet');
}

/* ── countries ─────────────────────────────────────────────────────── */
const COUNTRY_METRICS = {
  owners: 'Owners', signups: 'Signups', active_owners: 'Active', properties: 'Properties',
  scans: 'Scans', messages: 'Assistant', paying: 'Paying',
};
const regionNames = (typeof Intl.DisplayNames === 'function')
  ? new Intl.DisplayNames(['en'], { type: 'region' }) : null;
function countryName(code) {
  if (!code || code === 'unknown') return 'Not chosen yet';
  try { return (regionNames && regionNames.of(code)) || code; } catch (_) { return code; }
}
/** The countries worth a line of their own; everything else is folded into "Other". */
const TREND_COUNTRIES = 4;
const TREND_COLORS = ['--series-1', '--series-2', '--series-3', '--series-4'];

function countriesHTML(d) {
  const c = d.countries || {};
  const rows = c.comparison || [];
  const m = state.countryMetric;
  const ranked = rows.slice().sort((a, b) => (b[m] || 0) - (a[m] || 0));
  const items = ranked.slice(0, 10).map((r) => ({ label: countryName(r.country), value: r[m] || 0 }));
  if (ranked.length > 10) {
    items.push({ label: 'Other (' + (ranked.length - 10) + ')',
                 value: ranked.slice(10).reduce((s, r) => s + (r[m] || 0), 0), color: '--series-muted' });
  }
  const rate = (a, b) => b ? pct(100 * a / b) : '—';
  const table = rows.length
    ? '<div class="scroll-x"><table class="data"><thead><tr><th>Country</th>' +
      '<th class="num">Owners</th><th class="num">Signups</th><th class="num">Active</th>' +
      '<th class="num">% active</th><th class="num">Properties / owner</th>' +
      '<th class="num">Scans</th><th class="num">Assistant</th><th class="num">Paying</th>' +
      '<th class="num">% paying</th></tr></thead><tbody>' + rows.map((r) =>
        '<tr><td>' + esc(countryName(r.country)) + '</td>' +
        '<td class="num">' + num(r.owners) + '</td>' +
        '<td class="num">' + num(r.signups) + '</td>' +
        '<td class="num">' + num(r.active_owners) + '</td>' +
        '<td class="num">' + rate(r.active_owners, r.owners) + '</td>' +
        '<td class="num">' + (r.owners ? (r.properties / r.owners).toFixed(1) : '—') + '</td>' +
        '<td class="num">' + num(r.scans) + '</td>' +
        '<td class="num">' + num(r.messages) + '</td>' +
        '<td class="num">' + num(r.paying) + '</td>' +
        '<td class="num">' + rate(r.paying, r.owners) + '</td></tr>').join('') +
      '</tbody></table></div>'
    : '<div class="empty">No owners yet</div>';

  const propCountry = (c.property_country || []).map((r) => ({ label: r.country, value: r.properties }));

  return section('', '<div class="card"><div class="card-head"><h3>Top countries by ' +
        esc(COUNTRY_METRICS[m].toLowerCase()) +
        info('Owners, properties and paying are totals right now; the rest count this range only.') +
        '</h3><div class="scroll-x">' + switcher('country-metric', COUNTRY_METRICS, m, 'Metric') +
        '</div></div>' + hbars(items, 'Nothing recorded yet') + '</div>') +
    section('Side by side', card('Every country',
        'The % columns are what make a small country comparable to a big one.', table)) +
    section('Over time', '<div class="grid charts">' +
        canvasCard('Signups', 'The ' + TREND_COUNTRIES + ' largest countries, the rest as Other.', 'c-country-signups') +
        canvasCard('Active owners', 'Distinct owners who wrote something, per country.', 'c-country-active') +
      '</div>') +
    section('Where the buildings are', card('Properties by property country',
        'Decides which rules apply. Can differ from the owner\'s country.',
        hbars(propCountry, 'No properties yet'))) +
    notesFor(d, ['countries']);
}
/** Lines for the largest countries plus one "Other", on the full run of buckets. */
function countryTrend(d, g, canvasId, rows, field, emptyText) {
  const sizes = {};
  ((d.countries || {}).comparison || []).forEach((r) => { sizes[r.country] = r.owners || 0; });
  const top = Object.keys(sizes).sort((a, b) => sizes[b] - sizes[a]).slice(0, TREND_COUNTRIES);
  const buckets = rows.length ? bucketKeys(d, rows) : [];
  const series = top.map((country, i) => ({ name: countryName(country), color: TREND_COLORS[i],
                                             match: (r) => r.country === country }));
  if (rows.some((r) => !top.includes(r.country))) {
    series.push({ name: 'Other', color: '--series-muted', match: (r) => !top.includes(r.country) });
  }
  chartOrEmpty(canvasId, rows, () => ({
    type: 'line',
    data: {
      labels: buckets.map((b) => bucketLabel(new Date(b).toISOString(), g)),
      datasets: series.map((s) => lineSeries(s.name, buckets.map((b) => rows
        .filter((r) => parseUtc(r.bucket).getTime() === b && s.match(r))
        .reduce((n, r) => n + (r[field] || 0), 0)), s.color)),
    },
    options: baseOptions(),
  }), emptyText);
}
function drawCountries(d, g) {
  const c = d.countries || {};
  countryTrend(d, g, 'c-country-signups', c.signups || [], 'signups', 'No signups in this range yet');
  countryTrend(d, g, 'c-country-active', c.active || [], 'active_owners', 'No write activity in this range yet');
  $('#country-metric').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    state.countryMetric = btn.dataset.v;
    renderTab();
  });
}

/* ── growth ────────────────────────────────────────────────────────── */
function retentionTable(d) {
  const r = d.engagement.retention || [];
  if (!r.length) return '<div class="empty">No cohorts with activity yet</div>';
  // Week N is days 7N..7N+7 after each owner's own signup, so a cohort can only be scored
  // once its last member (who signed up at the end of the cohort week) is past that. Before
  // then the query returns 0, which reads as "everyone left" instead of "too early to tell".
  const now = parseUtc(d.generated_at).getTime();
  const retained = (x, n, count) => {
    if (!x.cohort_size) return '—';
    const measured = parseUtc(x.cohort_week).getTime() + (n + 2) * 7 * DAY_MS;
    if (measured > now) {
      return '<span class="pill" title="Some owners in this cohort have not reached week ' + n +
        ' yet">pending</span>';
    }
    return pct(100 * count / x.cohort_size);
  };
  return '<div class="scroll-x"><table class="data"><thead><tr><th>Cohort week</th>' +
    '<th class="num">Size</th><th class="num">Week 1</th><th class="num">Week 4</th></tr></thead><tbody>' +
    r.map((x) =>
      '<tr><td>' + esc(bucketLabel(x.cohort_week, 'week')) + '</td>' +
      '<td class="num">' + num(x.cohort_size) + '</td>' +
      '<td class="num">' + retained(x, 1, x.retained_week_1) + '</td>' +
      '<td class="num">' + retained(x, 4, x.retained_week_4) + '</td></tr>').join('') +
    '</tbody></table></div>';
}

function growthHTML(d) {
  const t = d.growth.totals || {};

  return section('Accounts', '<div class="grid tiles">' +
        tile('Live owners', num(t.live_owners), 'exist right now') +
        tile('New', num(t.new_in_window), 'signed up in this range') +
        tile('Deleted', num(t.deleted_in_window), 'in this range', false,
             'Not filtered by country — the deletion record stores none.') +
        tile('Deleted all time', num(t.deleted_all_time), 'since 2026-07-31') +
      '</div><div class="grid charts">' +
        canvasCard('Signups', 'From owners.created_at', 'c-signups') +
        canvasCard('Active owners', 'Distinct owners who wrote something. Pure edits are not counted.', 'c-active') +
      '</div>') +
    section('Retention', '<div class="grid charts">' +
        card('By signup cohort', 'Cohort size shown so a small cohort is never read as a trend.',
             retentionTable(d)) +
      '</div>') +
    notesFor(d, ['funnel', 'engagement']);
}
function drawGrowth(d, g) {
  const s = fillBuckets(d, d.growth.signups, ['signups']);
  chartOrEmpty('c-signups', s, () => ({
    type: 'line',
    data: { labels: s.map((r) => bucketLabel(r.bucket, g)),
            datasets: [lineSeries('Signups', s.map((r) => r.signups), '--series-1')] },
    options: singleSeries(),
  }), 'No signups in this range yet');

  const a = fillBuckets(d, d.engagement.active_owners, ['active_owners']);
  chartOrEmpty('c-active', a, () => ({
    type: 'line',
    data: { labels: a.map((r) => bucketLabel(r.bucket, g)),
            datasets: [lineSeries('Active owners', a.map((r) => r.active_owners), '--series-1')] },
    options: singleSeries(),
  }), 'No write activity in this range yet');
}

/* ── AI ────────────────────────────────────────────────────────────── */
function aiHTML(d) {
  const acc = d.ai.accuracy || {}, cap = d.ai.cap_hits || {}, lim = d.ai.limits || {};
  const scans = d.ai.scans || [];
  const totalScans = scans.reduce((s, r) => s + (r.scans || 0), 0);
  const saved = scans.reduce((s, r) => s + (r.saved || 0), 0);

  const cf = d.ai.corrected_fields || [];
  const fields = cf.length
    ? '<div class="scroll-x"><table class="data"><thead><tr><th>Section</th><th>Field</th>' +
      '<th class="num">Corrections</th><th class="num">Scans</th></tr></thead><tbody>' +
      cf.slice(0, 15).map((r) => '<tr><td>' + esc(r.section) + '</td><td>' + esc(r.field) +
        '</td><td class="num">' + num(r.corrections) + '</td><td class="num">' +
        num(r.scans_affected) + '</td></tr>').join('') + '</tbody></table></div>'
    : '<div class="empty">No corrections recorded yet</div>';

  return section('Lease scanning', '<div class="grid tiles">' +
        tile('Scans', num(totalScans), 'in this range') +
        tile('Saved', totalScans ? pct(100 * saved / totalScans) : '—', 'the rest were abandoned', false,
             'Abandonment is an upper bound — a save whose callback never arrived reads as abandoned.') +
        tile('Corrected fields / scan', num(acc.avg_changed_per_scan),
             acc.pct_fields_corrected != null ? pct(acc.pct_fields_corrected) + ' of prefilled fields' : '') +
      '</div><div class="grid charts">' +
        canvasCard('Saved vs abandoned', '', 'c-scans') +
        card('Most-corrected fields',
             'Field names only — the corrected values are lease content and are never queried.', fields) +
      '</div>') +
    section('Assistant', '<div class="grid tiles">' +
        tile('Messages', num((d.ai.assistant || []).reduce((s, r) => s + (r.messages || 0), 0)), 'in this range') +
        tile('Owners at daily cap', num(cap.owners_at_cap),
             'reached ' + num(lim.daily_message_limit) + ' messages in a day', false,
             'An estimate: counts owners who reached the limit, not owners who were turned away.') +
      '</div><div class="grid charts">' +
        canvasCard('Messages', 'One per user message', 'c-agent') +
      '</div>') +
    notesFor(d, ['ai']);
}
function drawAI(d, g) {
  const s = fillBuckets(d, d.ai.scans, ['scans', 'saved']);
  chartOrEmpty('c-scans', s, () => ({
    type: 'bar',
    data: { labels: s.map((r) => bucketLabel(r.bucket, g)), datasets: [
      barSeries('Saved', s.map((r) => r.saved), '--series-1'),
      barSeries('Abandoned', s.map((r) => (r.scans || 0) - (r.saved || 0)), '--series-2'),
    ] },
    options: baseOptions({
      scales: Object.assign(baseOptions().scales, {
        x: Object.assign({}, baseOptions().scales.x, { stacked: true }),
        y: Object.assign({}, baseOptions().scales.y, { stacked: true }),
      }),
    }),
  }), 'No lease scans in this range yet');

  const a = fillBuckets(d, d.ai.assistant, ['messages']);
  chartOrEmpty('c-agent', a, () => ({
    type: 'line',
    data: { labels: a.map((r) => bucketLabel(r.bucket, g)),
            datasets: [lineSeries('Messages', a.map((r) => r.messages), '--series-1')] },
    options: singleSeries(),
  }), 'No assistant usage in this range yet');
}

/* ── platform ──────────────────────────────────────────────────────── */
// One card with a switch instead of five near-identical tables. Bars with a share are easier
// to compare at a glance than a column of raw counts.
// Countries have their own tab.
const BREAKDOWNS = {
  language:         { label: 'Language', key: 'locale', value: 'owners', unit: 'owners',
                      note: 'Which of the two legal texts they accepted — covers every owner.' },
  signup_platform:  { label: 'Signup platform', key: 'platform', value: 'owners', unit: 'owners',
                      note: 'From the mandatory consent gate, so it covers every owner.' },
  devices:          { label: 'Push devices', key: 'platform', value: 'owners', unit: 'owners',
                      note: 'Owners with a registered push token, by device platform.' },
};
function breakdownBody(d) {
  const b = BREAKDOWNS[state.breakdown];
  return hbars((d.platform[state.breakdown] || [])
    .map((r) => ({ label: r[b.key], value: r[b.value] || 0 }))
    .sort((x, y) => y.value - x.value));
}
// Builds that predate the X-Client-* headers (2026-09-18) are stored as 'unknown'. Named for
// what they almost certainly are, so the biggest bar does not read as a data bug.
const APP_LABELS = { mobile: 'Mobile', web: 'Web', unknown: 'Not reported (older app build)' };
function platformHTML(d) {
  const p = d.platform;
  const writesByApp = sumBy(p.client_usage || [], 'app', 'writes');
  const allWrites = Object.values(writesByApp).reduce((s, v) => s + v, 0);
  const reported = allWrites ? pct(100 * (allWrites - (writesByApp.unknown || 0)) / allWrites) : null;
  const overlap = (p.client_overlap || []).filter((r) => r.segment !== 'unknown');
  const overlapBody = overlap.length
    ? '<table class="data"><thead><tr><th>Segment</th><th class="num">Owners</th>' +
      '<th class="num">Writes</th></tr></thead><tbody>' + overlap.map((r) =>
        '<tr><td>' + esc(r.segment) + '</td><td class="num">' + num(r.owners) +
        '</td><td class="num">' + num(r.writes) + '</td></tr>').join('') + '</tbody></table>'
    : '<div class="empty">No client usage recorded yet.</div>';

  const b = BREAKDOWNS[state.breakdown];
  const labels = Object.fromEntries(Object.entries(BREAKDOWNS).map(([k, v]) => [k, v.label]));

  return section('Where owners work', '<div class="grid charts">' +
        card('Writes by client',
          'A glance and an evening of work are not the same, so this counts writes, not sessions. ' +
          'Builds from before 2026-09-18 do not say which app they are and show as not reported.',
          '<div class="chart-wrap"><canvas id="c-client"></canvas></div>' +
          (reported ? '<div class="caption" style="font-size:12px;color:var(--muted);margin-top:8px">' +
            reported + ' of writes in this range came from a build that reports its app.</div>' : '')) +
        card('Mobile / web / both', 'Owners can appear in both. Owners seen only on unreported builds are left out.', overlapBody) +
      '</div>') +
    section('Who they are', '<div class="card"><div class="card-head"><h3>' + esc(b.label) +
        ' <span style="font-weight:400;color:var(--muted)">· ' + esc(b.unit) + '</span>' + info(b.note) +
        '</h3><div class="scroll-x">' + switcher('breakdown-seg', labels, state.breakdown, 'Breakdown') + '</div></div>' +
        '<div id="breakdown-body">' + breakdownBody(d) + '</div></div>') +
    notesFor(d, ['platform']);
}
function drawPlatform(d, g) {
  const rows = d.platform.client_over_time || [];
  const order = ['mobile', 'web', 'unknown'];
  const apps = [...new Set(rows.map((r) => r.app))]
    .sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  // Rows are one per (bucket, app), so the full bucket run is built here rather than by
  // fillBuckets; a bucket with no row for an app is already drawn as 0 below.
  const buckets = rows.length ? bucketKeys(d, rows) : [];
  // Colour follows the entity, not its position in the array. If 'unknown' stops appearing,
  // mobile and web must keep the colours they had — a series that changes colour when the
  // data changes is unreadable across two screenshots.
  const appColor = { mobile: '--series-1', web: '--series-2' };
  chartOrEmpty('c-client', rows, () => ({
    type: 'bar',
    data: {
      labels: buckets.map((b) => bucketLabel(new Date(b).toISOString(), g)),
      datasets: apps.map((app) => barSeries(APP_LABELS[app] || app,
        buckets.map((b) => {
          const hit = rows.find((r) => parseUtc(r.bucket).getTime() === b && r.app === app);
          return hit ? (hit.writes || 0) : 0;
        }), appColor[app] || '--series-muted')),
    },
    options: baseOptions(),
  }), 'No client usage recorded yet.');

  $('#breakdown-seg').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    state.breakdown = btn.dataset.v;
    renderTab();
  });
}

/* ── health ────────────────────────────────────────────────────────── */
function healthHTML(d) {
  const jobs = d.operations.jobs || [];
  const now = Date.now();
  const jobsBody = jobs.length
    ? '<div class="scroll-x"><table class="data"><thead><tr><th>Job</th><th class="num">Runs</th>' +
      '<th class="num">Failed</th><th>Last success</th><th>State</th></tr></thead><tbody>' +
      jobs.map((j) => {
        const stale = isStale(j, now);
        return '<tr><td>' + esc(j.job_name) + '</td>' +
          '<td class="num">' + num(j.runs) + '</td>' +
          '<td class="num">' + num(j.bad_runs) + '</td>' +
          '<td>' + (j.last_ok ? parseUtc(j.last_ok).toLocaleString() : 'never') + '</td>' +
          '<td><span class="pill ' + (stale ? 'bad' : 'ok') + '">' +
            (stale ? 'stale' : 'healthy') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>'
    : '<div class="empty">No job runs recorded in this range</div>';

  const dh = d.operations.data_health || [];
  const dhBody = dh.length
    ? '<div class="scroll-x"><table class="data"><thead><tr><th>Table</th><th class="num">Rows</th>' +
      '<th>Earliest</th><th>Latest</th></tr></thead><tbody>' + dh.map((r) =>
        '<tr><td>' + esc(r.table_name) + '</td><td class="num">' + num(r.rows) + '</td><td>' +
        (r.earliest ? String(r.earliest).slice(0, 10) : '—') + '</td><td>' +
        (r.latest ? String(r.latest).slice(0, 10) : '—') + '</td></tr>').join('') +
      '</tbody></table></div>'
    : '<div class="empty">No tables reported</div>';

  return section('Background jobs', card('Last runs',
      'Stale = no success in 36 hours. A cron that dies quietly stops reminders and says nothing.', jobsBody)) +
    section('Data health', card('Tables behind the metrics',
      'Row counts and the real date range behind every number on this dashboard.', dhBody));
}

/* ── controls ──────────────────────────────────────────────────────── */
$('#range-seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  [...e.currentTarget.children].forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  state.range = btn.dataset.v;
  load();
});
$('#country').addEventListener('change', (e) => { state.country = e.target.value; load(); });
$('#refresh').addEventListener('click', load);
tabFromHash();
renderTab();

// Last statement on purpose: onAuthStateChanged can call load() -> render, which uses the
// const helpers defined above, and a const is not readable before its definition runs.
// Nothing above may throw at top level or this never executes — that is what the missing
// Chart.js did, and why Chart.register is now guarded.
initAuth();
</script>
</body>
</html>
